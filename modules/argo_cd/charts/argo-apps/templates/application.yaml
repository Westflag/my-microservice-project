{{- range .Values.applications }}\napiVersion: argoproj.io/v1alpha1\nkind: Application\nmetadata:\n  name: {{ .name }}\n  namespace: argocd\nspec:\n  project: default\n  source:\n    repoURL: {{ .repoURL | quote }}\n    targetRevision: {{ .targetRevision | quote }}\n    path: {{ .path | quote }}\n  destination:\n    server: https://kubernetes.default.svc\n    namespace: {{ .namespace | quote }}\n  syncPolicy:\n    automated:\n      prune: true\n      selfHeal: true\n---\n{{- end }}\n